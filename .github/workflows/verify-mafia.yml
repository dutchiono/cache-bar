name: Verify Mafia URL
on: workflow_dispatch
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Probe lane URLs
        run: |
          for u in \
            "https://dotcache.bushleague.xyz/mafia/" \
            "https://dotcache.bushleague.xyz/mafia/index.html" ; do
            echo "=== $u ==="
            curl -sSL -o /tmp/bf.html -w "code=%{http_code} url=%{url_effective}\n" "$u" || true
            grep -aoiE "SOLMAFIA|MOCK MODE|<title>[^<]*</title>|/mafia/_next" /tmp/bf.html | sort -u | head -5 || true
          done

      - name: Inspect server (deploy user)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DOTCACHE_DEPLOY_USER }}
          key: ${{ secrets.DOTCACHE_DEPLOY_SSH_KEY }}
          script: |
            echo "=== whoami ==="; whoami
            echo "=== deploy path dist listing ==="
            ls -la "${{ secrets.DOTCACHE_DEPLOY_PATH }}/dist" | head -40 || true
            echo "=== mafia dir ==="
            ls -la "${{ secrets.DOTCACHE_DEPLOY_PATH }}/dist/mafia" | head -20 || true
            echo "=== first line of dotcache index.html vs mafia index.html ==="
            head -c 200 "${{ secrets.DOTCACHE_DEPLOY_PATH }}/dist/index.html" 2>/dev/null; echo
            echo "----"
            head -c 200 "${{ secrets.DOTCACHE_DEPLOY_PATH }}/dist/mafia/index.html" 2>/dev/null; echo
            echo "=== nginx configs mentioning dotcache (if readable) ==="
            grep -rl dotcache /etc/nginx 2>/dev/null || echo "cannot read /etc/nginx"
            echo "=== dump matching vhost(s) ==="
            for f in $(grep -rl dotcache /etc/nginx 2>/dev/null); do echo "##### $f #####"; cat "$f" 2>/dev/null; done || true
