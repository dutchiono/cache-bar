# Serves the Sol Mafia app as a subfolder of the already-provisioned dotcache
# storefront, so it's live without a new server slot, DNS, or secrets.
# Builds the public dutchiono/sol-mafia app as a static export under /mafia and
# uploads it to ${DOTCACHE_DEPLOY_PATH}/dist/mafia using this repo's existing
# DOTCACHE deploy secrets. Live at https://dotcache.bushleague.xyz/mafia/.
name: Deploy Sol Mafia (dotcache lane)

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "sol-mafia git ref to build"
        default: "claude/sol-mafia-handover-2fvmek"

concurrency:
  group: mafia-lane-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sol-mafia
        uses: actions/checkout@v4
        with:
          repository: dutchiono/sol-mafia
          ref: ${{ inputs.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build static export under /mafia (mock mode)
        working-directory: app
        env:
          STATIC_EXPORT: "1"
          BASE_PATH: "/mafia"
          NEXT_PUBLIC_MOCK: "1"
        run: |
          npm ci
          npm run build
          # Copy the export to a clean top-level dir so scp strip_components is
          # unambiguous (mirrors cache-bar's own dist/* + strip 1 shape).
          rm -rf "$GITHUB_WORKSPACE/_site"
          cp -r out "$GITHUB_WORKSPACE/_site"

      - name: Show local build tree
        run: |
          echo "=== _site (top level) ==="; ls -la "$GITHUB_WORKSPACE/_site"
          echo "=== index.html present? ==="; test -f "$GITHUB_WORKSPACE/_site/index.html" && echo "yes" || echo "NO"

      - name: Ensure /mafia lane exists
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DOTCACHE_DEPLOY_USER }}
          key: ${{ secrets.DOTCACHE_DEPLOY_SSH_KEY }}
          script: |
            set -e
            umask 022
            mkdir -p "${{ secrets.DOTCACHE_DEPLOY_PATH }}/dist/mafia"

      - name: Upload to dotcache /mafia lane
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DOTCACHE_DEPLOY_USER }}
          key: ${{ secrets.DOTCACHE_DEPLOY_SSH_KEY }}
          source: "_site/*"
          target: "${{ secrets.DOTCACHE_DEPLOY_PATH }}/dist/mafia"
          strip_components: 1
          rm: true

      - name: Fix permissions and verify remote tree
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DOTCACHE_DEPLOY_USER }}
          key: ${{ secrets.DOTCACHE_DEPLOY_SSH_KEY }}
          script: |
            set -e
            D="${{ secrets.DOTCACHE_DEPLOY_PATH }}/dist/mafia"
            find "$D" -type d -exec chmod 755 {} \;
            find "$D" -type f -exec chmod 644 {} \;
            echo "=== $D ==="; ls -la "$D"
            echo "=== index.html present? ==="; test -f "$D/index.html" && echo "yes" || echo "NO"
