name: Inspect Production

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect nginx and deploy target
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            echo "=== whoami ==="
            whoami
            echo "=== hostname ==="
            hostname
            echo "=== deploy path ==="
            echo "${{ secrets.DEPLOY_PATH }}"
            echo "=== deploy path contents ==="
            ls -la "${{ secrets.DEPLOY_PATH }}" || true
            echo "=== deploy site match ==="
            SITE_FILE="$(grep -R -l "root[[:space:]]\+${{ secrets.DEPLOY_PATH }}/dist;" /etc/nginx/sites-enabled /etc/nginx/sites-available 2>/dev/null | head -n1 || true)"
            echo "site file: ${SITE_FILE:-not-found}"
            if [ -n "$SITE_FILE" ] && [ -f "$SITE_FILE" ]; then
              echo "=== matched server_name ==="
              SERVER_NAME="$(awk '/server_name/ {for (i = 2; i <= NF; i++) {gsub(/;/, "", $i); if ($i != "") print $i}}' "$SITE_FILE" | paste -sd ',' -)"
              echo "raw server names: ${SERVER_NAME:-not-found}"
              echo "server names dotted: $(printf '%s' "$SERVER_NAME" | sed 's/\./ [dot] /g')"
              echo "server names reversed: $(printf '%s' "$SERVER_NAME" | rev)"
              echo "server names char codes: $(printf '%s' "$SERVER_NAME" | od -An -t u1 | tr '\n' ' ' | sed 's/[[:space:]]\\+/ /g; s/^ //; s/ $//')"
              echo "=== matched config excerpt ==="
              sed -n '1,160p' "$SITE_FILE"
            else
              echo "No nginx site matched deploy path"
            fi
