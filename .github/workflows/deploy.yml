name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cache-bar-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate required build secrets
        run: |
          test -n "${{ secrets.VITE_CONVEX_URL }}" || { echo "Missing required secret: VITE_CONVEX_URL"; exit 1; }
          test -n "${{ secrets.CONVEX_DEPLOY_KEY }}" || { echo "Missing required secret: CONVEX_DEPLOY_KEY"; exit 1; }

      - name: Deploy Convex backend (prod)
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
        run: bunx convex deploy

      - name: Build
        env:
          VITE_CONVEX_URL: ${{ secrets.VITE_CONVEX_URL }}
        run: bun run build

      - name: Ensure deploy directory exists
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            mkdir -p "${{ secrets.DEPLOY_PATH }}/dist"

      - name: Upload dist
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: "dist/*"
          target: "${{ secrets.DEPLOY_PATH }}/dist"
          strip_components: 1
          rm: true
