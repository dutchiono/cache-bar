name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cache-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate required build secrets
        run: |
          test -n "${{ secrets.VITE_CONVEX_URL }}" || { echo "Missing required secret: VITE_CONVEX_URL"; exit 1; }
          test -n "${{ secrets.CONVEX_DEPLOY_KEY }}" || { echo "Missing required secret: CONVEX_DEPLOY_KEY"; exit 1; }

      - name: Deploy Convex backend (prod)
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
        run: bunx convex deploy

      - name: Sync optional Convex checkout env
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          APP_URL: ${{ secrets.APP_URL }}
          CACHE_ELIZA_BASE_URL: ${{ secrets.CACHE_ELIZA_BASE_URL }}
          CACHE_ELIZA_API_KEY: ${{ secrets.CACHE_ELIZA_API_KEY }}
          CACHE_ELIZA_AGENT_ID: ${{ secrets.CACHE_ELIZA_AGENT_ID }}
          CACHE_ELIZA_CHANNEL_ID: ${{ secrets.CACHE_ELIZA_CHANNEL_ID }}
          DISCORD_APPLICATION_ID: ${{ secrets.DISCORD_APPLICATION_ID }}
          DISCORD_API_TOKEN: ${{ secrets.DISCORD_API_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          set -e
          if [ -n "$STRIPE_SECRET_KEY" ]; then
            bunx convex env set --prod STRIPE_SECRET_KEY "$STRIPE_SECRET_KEY"
          fi
          if [ -n "$STRIPE_WEBHOOK_SECRET" ]; then
            bunx convex env set --prod STRIPE_WEBHOOK_SECRET "$STRIPE_WEBHOOK_SECRET"
          fi
          if [ -n "$APP_URL" ]; then
            bunx convex env set --prod APP_URL "$APP_URL"
          fi
          if [ -n "$CACHE_ELIZA_BASE_URL" ]; then
            bunx convex env set --prod CACHE_ELIZA_BASE_URL "$CACHE_ELIZA_BASE_URL"
          fi
          if [ -n "$CACHE_ELIZA_API_KEY" ]; then
            bunx convex env set --prod CACHE_ELIZA_API_KEY "$CACHE_ELIZA_API_KEY"
          fi
          if [ -n "$CACHE_ELIZA_AGENT_ID" ]; then
            bunx convex env set --prod CACHE_ELIZA_AGENT_ID "$CACHE_ELIZA_AGENT_ID"
          fi
          if [ -n "$CACHE_ELIZA_CHANNEL_ID" ]; then
            bunx convex env set --prod CACHE_ELIZA_CHANNEL_ID "$CACHE_ELIZA_CHANNEL_ID"
          fi
          if [ -n "$DISCORD_APPLICATION_ID" ]; then
            bunx convex env set --prod DISCORD_APPLICATION_ID "$DISCORD_APPLICATION_ID"
          fi
          if [ -n "$DISCORD_API_TOKEN" ]; then
            bunx convex env set --prod DISCORD_API_TOKEN "$DISCORD_API_TOKEN"
          fi
          if [ -n "$TELEGRAM_BOT_TOKEN" ]; then
            bunx convex env set --prod TELEGRAM_BOT_TOKEN "$TELEGRAM_BOT_TOKEN"
          fi

      - name: Seed storefront data
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
        run: bunx convex run bootstrap:ensureStorefront

      - name: Build
        env:
          VITE_CONVEX_URL: ${{ secrets.VITE_CONVEX_URL }}
        run: bun run build

      - name: Ensure deploy directory exists
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            mkdir -p "${{ secrets.DEPLOY_PATH }}/dist"

      - name: Upload dist
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: "dist/*"
          target: "${{ secrets.DEPLOY_PATH }}/dist"
          strip_components: 1
          rm: true
