<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>.cache — Admin</title>
<link rel='icon' type='image/svg+xml' href='/favicon.svg' />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@300;400;500;600&display=swap" rel="stylesheet" />

<style>
  .admin{padding:120px 40px 80px;max-width:1500px;margin:0 auto;position:relative;z-index:1}

  /* ----- gated login screen ----- */
  .gate{min-height:80svh;display:grid;place-items:center;padding:80px 24px}
  .gate__inner{display:flex;flex-direction:column;gap:32px;max-width:560px;width:100%}
  .gate h1{font-family:var(--display);font-size:clamp(56px,8vw,128px);line-height:.92;letter-spacing:-.025em;text-transform:uppercase;color:var(--fg)}
  .gate h1 em{font-style:normal;color:var(--accent)}
  .gate p{font-size:14px;line-height:1.6;color:var(--fg-2);max-width:420px}
  .gate form{display:flex;flex-direction:column;gap:24px;margin-top:24px}
  .gate label{font:500 11px/1 var(--mono);letter-spacing:.28em;text-transform:uppercase;color:var(--muted)}
  .gate input{
    background:transparent;border:0;outline:none;border-bottom:1px solid var(--line);
    font:500 24px/1.3 var(--ui);color:var(--fg);padding:0 0 14px;width:100%;
    transition:border-color .3s;
  }
  .gate input:focus{border-color:var(--fg)}
  .gate button{
    align-self:flex-start;display:inline-flex;align-items:center;gap:14px;padding:18px 28px;
    background:var(--fg);color:var(--bg);border-radius:999px;
    font:500 12px/1 var(--mono);letter-spacing:.28em;text-transform:uppercase;
    transition:background .3s,color .3s;
  }
  .gate button:hover{background:var(--accent);color:var(--fg)}
  .gate .key-hint{font:500 10px/1.4 var(--mono);letter-spacing:.22em;text-transform:uppercase;color:var(--muted);margin-top:12px}
  .gate .key-hint b{color:var(--accent);font-weight:500}

  /* ----- header ----- */
  .admin__bar{display:grid;grid-template-columns:1fr auto;gap:32px;align-items:end;padding-bottom:32px;border-bottom:1px solid var(--line);margin-bottom:40px}
  .admin__bar h1{font-family:var(--display);font-size:clamp(48px,7vw,108px);line-height:.92;letter-spacing:-.025em;text-transform:uppercase}
  .admin__bar h1 em{font-style:normal;color:var(--accent)}
  .admin__meta{font:500 11px/1.5 var(--mono);letter-spacing:.22em;text-transform:uppercase;color:var(--muted);text-align:right;display:flex;flex-direction:column;gap:6px}
  .admin__meta strong{color:var(--fg);font-weight:500}
  .admin__meta .sign-out{color:var(--fg-2);transition:color .3s;margin-top:10px;display:inline-flex;align-items:center;gap:8px}
  .admin__meta .sign-out:hover{color:var(--hot)}
  .admin__live{color:var(--acid);display:inline-flex;align-items:center;gap:6px}
  .admin__live::before{content:"";width:5px;height:5px;border-radius:50%;background:currentColor;box-shadow:0 0 8px var(--acid)}

  /* ----- tabs ----- */
  .admin__nav{display:flex;gap:36px;flex-wrap:wrap;padding:0 0 20px;border-bottom:1px solid var(--line);margin-bottom:48px}
  .admin__nav button{padding:8px 0;font:500 11px/1 var(--mono);letter-spacing:.24em;text-transform:uppercase;color:var(--muted);transition:color .3s;border-bottom:1px solid transparent;display:inline-flex;align-items:center;gap:8px}
  .admin__nav button:hover{color:var(--fg-2)}
  .admin__nav button.is-on{color:var(--fg);border-color:var(--fg)}
  .admin__nav .count{font:500 9px/1 var(--mono);letter-spacing:.18em;padding:3px 6px;background:var(--bg-3);color:var(--fg-2);border-radius:3px}
  .admin__nav button.is-on .count{background:var(--fg);color:var(--bg)}

  .panel{display:none;animation:fade .4s ease}
  .panel.is-on{display:block}
  @keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

  /* stats strip */
  .kpi{display:grid;grid-template-columns:repeat(4,1fr);gap:0;margin-bottom:60px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
  .kpi__cell{padding:32px;border-left:1px solid var(--line);display:flex;flex-direction:column;gap:12px}
  .kpi__cell:first-child{border-left:0}
  .kpi__cell .lbl{font:500 10px/1 var(--mono);letter-spacing:.28em;text-transform:uppercase;color:var(--muted)}
  .kpi__cell .val{font-family:var(--display);font-size:48px;line-height:.95;letter-spacing:-.02em;color:var(--fg)}
  .kpi__cell .val.acc{color:var(--accent)}
  .kpi__cell .sub{font:500 11px/1.4 var(--mono);letter-spacing:.18em;text-transform:uppercase;color:var(--fg-2)}
  .kpi__cell .trend{color:var(--acid)}
  .kpi__cell .trend.down{color:var(--hot)}

  /* common card grid */
  .panel-head{display:flex;justify-content:space-between;align-items:end;gap:24px;flex-wrap:wrap;margin-bottom:32px}
  .panel-head h2{font-family:var(--display);font-size:48px;line-height:.95;letter-spacing:-.02em;text-transform:uppercase;color:var(--fg)}
  .panel-head .panel-actions{display:flex;gap:18px;flex-wrap:wrap;align-items:center}
  .panel-search{
    display:inline-flex;align-items:center;gap:8px;padding:10px 14px;border:1px solid var(--line);border-radius:999px;color:var(--fg-2);
    font:500 11px/1 var(--mono);letter-spacing:.18em;text-transform:uppercase;
  }
  .panel-search input{background:transparent;border:0;outline:none;color:var(--fg);font:inherit;text-transform:none;letter-spacing:0;min-width:200px}
  .panel-search input::placeholder{color:var(--muted)}
  .btn-new{
    display:inline-flex;align-items:center;gap:10px;padding:12px 18px;
    background:var(--fg);color:var(--bg);border-radius:999px;
    font:500 11px/1 var(--mono);letter-spacing:.22em;text-transform:uppercase;
  }
  .btn-new:hover{background:var(--accent);color:var(--fg)}

  /* table */
  .a-table{display:flex;flex-direction:column;gap:0}
  .a-row{display:grid;gap:24px;align-items:center;padding:18px 8px;border-bottom:1px solid var(--line);font:500 12px/1.3 var(--mono);letter-spacing:.04em;color:var(--fg-2);transition:padding .3s cubic-bezier(.2,.7,.2,1)}
  .a-row:hover{padding-left:24px;background:#0e0d0b}
  .a-row.head{color:var(--muted);font-size:10px;letter-spacing:.22em;text-transform:uppercase;padding:14px 8px;background:transparent}
  .a-row.head:hover{padding-left:8px;background:transparent}
  .a-row .nm{font-family:var(--display);font-size:16px;letter-spacing:-.01em;text-transform:uppercase;color:var(--fg)}
  .a-row .nm small{display:block;font-family:var(--mono);font-size:9px;letter-spacing:.2em;color:var(--muted);margin-top:4px;text-transform:uppercase}
  .a-row .stat{display:inline-flex;align-items:center;gap:6px;text-transform:uppercase;font-size:10px;letter-spacing:.2em}
  .a-row .stat::before{content:"";width:5px;height:5px;border-radius:50%;background:currentColor}
  .a-row .stat.ok{color:var(--acid)}
  .a-row .stat.live{color:var(--accent)}
  .a-row .stat.low{color:var(--hot)}
  .a-row .stat.out{color:var(--muted)}
  .a-row .stat.draft{color:var(--muted)}
  .a-row .stat.archived{color:var(--muted-2)}
  .a-row .actions{display:flex;gap:14px;justify-content:flex-end}
  .a-row .actions a{font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--fg-2);border-bottom:1px solid var(--line);padding-bottom:2px;transition:color .3s, border-color .3s}
  .a-row .actions a:hover{color:var(--accent);border-color:var(--accent)}
  .a-row .actions a.danger:hover{color:var(--hot);border-color:var(--hot)}

  /* drops: column widths */
  .a-table.drops .a-row{grid-template-columns:140px 1fr 110px 110px 110px 140px}
  /* orders */
  .a-table.orders .a-row{grid-template-columns:120px 1fr 120px 110px 100px 110px}
  /* inventory */
  .a-table.inv .a-row{grid-template-columns:100px 1fr 90px 100px 90px 90px 140px}
  /* members */
  .a-table.members .a-row{grid-template-columns:80px 1fr 100px 110px 110px 110px}
  /* ambassadors */
  .a-table.amb .a-row{grid-template-columns:1fr 110px 100px 110px 110px 130px}

  /* stock pill */
  .stock-pill{display:inline-flex;align-items:center;gap:6px;font-size:10px;letter-spacing:.2em;text-transform:uppercase}
  .stock-pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}

  /* charts (simple svg) */
  .chart-row{display:grid;grid-template-columns:1.6fr 1fr;gap:40px;margin-bottom:60px}
  .chart-card{padding:32px;border:1px solid var(--line);border-radius:6px;background:linear-gradient(180deg,#0e0d0b,#0a0a09);display:flex;flex-direction:column;gap:24px;min-height:280px}
  .chart-card h4{font-family:var(--display);font-size:24px;line-height:1;letter-spacing:-.01em;text-transform:uppercase;color:var(--fg);display:flex;justify-content:space-between;align-items:baseline;gap:14px}
  .chart-card h4 small{font:500 10px/1 var(--mono);letter-spacing:.24em;color:var(--muted)}
  .chart-svg{width:100%;flex:1;min-height:140px}

  .pie-list{display:flex;flex-direction:column;gap:14px;margin-top:auto}
  .pie-list li{display:grid;grid-template-columns:14px 1fr auto;gap:14px;align-items:center;font:500 11px/1 var(--mono);letter-spacing:.06em;color:var(--fg-2);text-transform:uppercase}
  .pie-list li .sw{width:14px;height:14px;border-radius:3px}
  .pie-list li .v{color:var(--fg);font-size:13px}

  /* settings simple */
  .settings-grid{display:grid;grid-template-columns:1fr 1fr;gap:60px 80px;max-width:1000px}
  .settings-grid .field{padding:24px 0;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:14px}
  .settings-grid .field label{font:500 11px/1 var(--mono);letter-spacing:.28em;text-transform:uppercase;color:var(--muted)}
  .settings-grid .field .val{font:500 18px/1.3 var(--ui);color:var(--fg)}
  .settings-grid .field input,.settings-grid .field select{
    background:transparent;border:0;outline:none;border-bottom:1px solid var(--line);
    font:500 18px/1.3 var(--ui);color:var(--fg);padding:0 0 10px;
  }
  .toggle{display:inline-flex;align-items:center;gap:14px}
  .toggle input{appearance:none;width:38px;height:22px;background:var(--line);border-radius:999px;position:relative;cursor:pointer;transition:background .3s}
  .toggle input::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;background:var(--fg-2);border-radius:50%;transition:all .3s}
  .toggle input:checked{background:var(--accent)}
  .toggle input:checked::after{left:19px;background:var(--bg)}

  @media (max-width:900px){
    .admin{padding:120px 24px 60px}
    .admin__bar{grid-template-columns:1fr}
    .admin__meta{text-align:left}
    .kpi{grid-template-columns:1fr 1fr}
    .kpi__cell:nth-child(3){border-top:1px solid var(--line)}
    .kpi__cell:nth-child(4){border-top:1px solid var(--line)}
    .kpi__cell:nth-child(odd){border-left:0}
    .chart-row{grid-template-columns:1fr}
    .a-table .a-row{grid-template-columns:1fr 1fr !important;gap:14px}
    .a-row .actions{justify-content:flex-start}
    .a-row.head{display:none}
    .settings-grid{grid-template-columns:1fr;gap:0}
  }
</style>
</head>

  function badge(text, color){ return `<span class="stat" style="color:${color}">${text}</span>`; }
  function statPill(kind, label){ return `<span class="stat ${kind}">${label}</span>`; }

  function renderGate(){
    document.getElementById('admin-root').innerHTML = `
      <div class="admin gate">
        <div class="gate__inner">
          <div class="section-eyebrow">// Admin · Restricted</div>
          <h1>Studio <em>access.</em></h1>
          <p>Twelve people share these keys. If you're one of them, type the studio passphrase. Everyone else, this isn't the door.</p>
          <form id="gate-form">
            <div>
              <label>Passphrase</label>
              <input id="gate-pass" type="password" placeholder="••••••••" autocomplete="off">
            </div>
            <button type="submit">
              <span>Enter Studio</span>
              <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M1 7H13M13 7L7 1M13 7L7 13" stroke="currentColor" stroke-width="1.2"/></svg>
            </button>
          </form>
          <div class="key-hint">Demo · any 4+ character passphrase opens the studio. Pass: <b>opensesame</b></div>
        </div>
      </div>`;
    document.getElementById('gate-form').addEventListener('submit', (e) => {
      e.preventDefault();
      const v = document.getElementById('gate-pass').value;
      if (v.length < 4) { showToast('Passphrase too short'); return; }
      adminSession.signIn({ name:'studio', signedAt: Date.now() });
      render();
    });
  }

  function spark(values, color){
    const max = Math.max(...values);
    const w = 600, h = 140, step = w / (values.length - 1);
    const pts = values.map((v, i) => `${i*step},${h - (v/max)*h*0.92 - 4}`).join(' ');
    const area = `0,${h} ${pts} ${w},${h}`;
    return `
      <svg class="chart-svg" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">
        <polygon points="${area}" fill="${color}" opacity=".18"/>
        <polyline points="${pts}" fill="none" stroke="${color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
        ${values.map((v, i) => `<circle cx="${i*step}" cy="${h - (v/max)*h*0.92 - 4}" r="2.5" fill="${color}"/>`).join('')}
      </svg>`;
  }

  function renderShell(){
    const u = adminSession.user || { name:'studio' };
    const root = document.getElementById('admin-root');
    root.innerHTML = `
      <main class="admin">
        <div class="admin__bar">
          <div>

          </div>
          <div class="admin__meta">
            <div><strong>${u.name}</strong></div>
            <div><span class="admin__live">Runtime online</span></div>
            <a href="#" class="sign-out" id="admin-out">Sign out</a>
          </div>
        </div>

        <div class="kpi">
          <div class="kpi__cell">
            <span class="lbl">Revenue · today</span>
            <span class="val">$3,124</span>
            <span class="sub"><span class="trend">▲ 22%</span> vs. yesterday</span>
          </div>
          <div class="kpi__cell">
            <span class="lbl">Orders · today</span>
            <span class="val">28</span>
            <span class="sub"><span class="trend">▲ 14%</span> vs. yesterday</span>
          </div>
          <div class="kpi__cell">
            <span class="lbl">Members</span>
            <span class="val acc">184<span style="color:var(--muted);font-size:24px"> / 500</span></span>
            <span class="sub">316 keys remaining</span>
          </div>
          <div class="kpi__cell">
            <span class="lbl">Drop 001 sold</span>
            <span class="val">42%</span>
            <span class="sub">211 / 500 pieces</span>
          </div>
        </div>

        <nav class="admin__nav" id="admin-nav">
          <button class="is-on" data-tab="overview">Overview</button>
          <button data-tab="drops">Drops <span class="count">${DROPS.length}</span></button>
          <button data-tab="inventory">Inventory <span class="count">${PRODUCTS.length}</span></button>
          <button data-tab="orders">Orders <span class="count">${ORDERS.length}</span></button>
          <button data-tab="members">Members <span class="count">${MEMBERS.length}</span></button>
          <button data-tab="ambassadors">Ambassadors <span class="count">${AMBS.length}</span></button>
          <button data-tab="settings">Settings</button>
        </nav>

        <!-- OVERVIEW -->
        <section class="panel is-on" data-panel="overview">
          <div class="chart-row">
            <div class="chart-card">
              <h4>Revenue · 14 days <small>$ USD</small></h4>
              ${spark([1100, 1380, 1420, 1240, 1680, 2100, 1990, 1840, 2240, 2380, 2010, 2620, 2840, 3124], '#c4a479')}
            </div>
            <div class="chart-card">
              <h4>Drop 001 mix <small>by category</small></h4>
              <ul class="pie-list">
                <li><span class="sw" style="background:#c4a479"></span><span>Apparel</span><span class="v">62%</span></li>
                <li><span class="sw" style="background:#e8e3d6"></span><span>Headwear</span><span class="v">14%</span></li>
                <li><span class="sw" style="background:#7b7770"></span><span>Objects</span><span class="v">16%</span></li>
                <li><span class="sw" style="background:#c8ff2d"></span><span>Digital</span><span class="v">8%</span></li>
              </ul>
            </div>
          </div>

          <div class="panel-head" style="margin-top:60px"><h2>Recent activity</h2><div class="panel-actions"><a href="#" style="font:500 11px/1 var(--mono);letter-spacing:.24em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--line)">All activity →</a></div></div>
          <div class="a-table orders">
            <div class="a-row head"><span>Order</span><span>Customer</span><span>Placed</span><span>Items</span><span>Total</span><span style="text-align:right">Status</span></div>
            ${ORDERS.slice(0,5).map(o => `
              <div class="a-row">
                <span>${o.id}</span>
                <span class="nm">${o.name}<small>${o.placed}</small></span>
                <span>${o.placed.slice(0,10)}</span>
                <span>${o.items}</span>
                <span>${o.total === 0 ? '—' : '$' + o.total}</span>
                <span style="text-align:right">${statPill(o.status === 'pending' ? 'low' : o.status === 'paid' ? 'live' : o.status === 'shipped' ? 'ok' : 'archived', o.status.toUpperCase())}</span>
              </div>`).join('')}
          </div>
        </section>

        <!-- DROPS -->
        <section class="panel" data-panel="drops">
          <div class="panel-head">
            <h2>Drops</h2>
            <div class="panel-actions">
              <div class="panel-search"><svg width="12" height="12" viewBox="0 0 12 12" fill="none"><circle cx="5" cy="5" r="3.5" stroke="currentColor" stroke-width="1.2"/><path d="M11 11L8 8" stroke="currentColor" stroke-width="1.2"/></svg><input placeholder="Search drops..."></div>
              <a href="#" class="btn-new">+ New Drop</a>
            </div>
          </div>
          <div class="a-table drops">
            <div class="a-row head"><span>Drop ID</span><span>Title</span><span>Release</span><span>Pieces</span><span>Sold</span><span style="text-align:right">Status · Actions</span></div>
            ${DROPS.map(d => `
              <div class="a-row">
                <span style="color:var(--fg)">${d.id}</span>
                <span class="nm">${d.title}<small>${d.revenue}</small></span>
                <span>${d.date}</span>
                <span>${d.pieces}</span>
                <span>${d.sold}</span>
                <span class="actions">${statPill(d.status === 'live' ? 'live' : d.status, d.status.toUpperCase())} <a href="#">Edit</a> <a href="#" class="danger">Archive</a></span>
              </div>`).join('')}
          </div>
        </section>

        <!-- INVENTORY -->
        <section class="panel" data-panel="inventory">
          <div class="panel-head">
            <h2>Inventory</h2>
            <div class="panel-actions">
              <div class="panel-search"><svg width="12" height="12" viewBox="0 0 12 12" fill="none"><circle cx="5" cy="5" r="3.5" stroke="currentColor" stroke-width="1.2"/><path d="M11 11L8 8" stroke="currentColor" stroke-width="1.2"/></svg><input placeholder="Filter by SKU..."></div>
              <a href="#" class="btn-new">+ Add Piece</a>
            </div>
          </div>
          <div class="a-table inv">
            <div class="a-row head"><span>SKU</span><span>Piece</span><span>Category</span><span>Price</span><span>Stock</span><span>Run</span><span style="text-align:right">Actions</span></div>
            ${PRODUCTS.map(p => {
              const stockKind = p.stock === 'ok' ? 'ok' : p.stock === 'digital' ? 'live' : p.stock;
              const stockLabel = p.stock === 'ok' ? 'In stock' : p.stock === 'low' ? 'Low' : p.stock === 'digital' ? 'Digital' : 'Sold out';
              return `
                <div class="a-row">
                  <span style="color:var(--fg)">${p.sku}</span>
                  <span class="nm">${p.name}<small>${p.composition || ''}</small></span>
                  <span>${p.cat}</span>
                  <span>${p.price}</span>
                  <span>${statPill(stockKind, stockLabel)}</span>
                  <span>${p.run || '—'}</span>
                  <span class="actions"><a href="product.html?sku=${p.sku}" target="_blank">View</a> <a href="#">Edit</a> <a href="#" class="danger">Hide</a></span>
                </div>`;
            }).join('')}
          </div>
        </section>

        <!-- ORDERS -->
        <section class="panel" data-panel="orders">
          <div class="panel-head">
            <h2>Orders</h2>
            <div class="panel-actions">
              <div class="panel-search"><svg width="12" height="12" viewBox="0 0 12 12" fill="none"><circle cx="5" cy="5" r="3.5" stroke="currentColor" stroke-width="1.2"/><path d="M11 11L8 8" stroke="currentColor" stroke-width="1.2"/></svg><input placeholder="Search orders..."></div>
              <a href="#" class="btn-new">Export CSV</a>
            </div>
          </div>
          <div class="a-table orders">
            <div class="a-row head"><span>Order</span><span>Customer</span><span>Placed</span><span>Items</span><span>Total</span><span style="text-align:right">Status</span></div>
            ${ORDERS.map(o => `
              <div class="a-row">
                <span style="color:var(--fg)">${o.id}</span>
                <span class="nm">${o.name}<small>${o.placed}</small></span>
                <span>${o.placed.slice(0,10)}</span>
                <span>${o.items}</span>
                <span>${o.total === 0 ? '—' : '$' + o.total}</span>
                <span style="text-align:right">${statPill(o.status === 'pending' ? 'low' : o.status === 'paid' ? 'live' : o.status === 'shipped' ? 'ok' : 'archived', o.status.toUpperCase())}</span>
              </div>`).join('')}
          </div>
        </section>

        <!-- MEMBERS -->
        <section class="panel" data-panel="members">
          <div class="panel-head">
            <h2>Members</h2>
            <div class="panel-actions">
              <div class="panel-search"><svg width="12" height="12" viewBox="0 0 12 12" fill="none"><circle cx="5" cy="5" r="3.5" stroke="currentColor" stroke-width="1.2"/><path d="M11 11L8 8" stroke="currentColor" stroke-width="1.2"/></svg><input placeholder="Search members..."></div>
              <a href="#" class="btn-new">Invite</a>
            </div>
          </div>
          <div class="a-table members">
            <div class="a-row head"><span>#</span><span>Handle</span><span>Joined</span><span>Tier</span><span>Orders</span><span style="text-align:right">Actions</span></div>
            ${MEMBERS.map(m => `
              <div class="a-row">
                <span style="color:var(--fg)">${m.num}</span>
                <span class="nm">${m.name}<small>${m.email}</small></span>
                <span>${m.joined}</span>
                <span>${statPill('live', m.tier)}</span>
                <span>${m.orders}</span>
                <span class="actions"><a href="#">View</a> <a href="#" class="danger">Revoke</a></span>
              </div>`).join('')}
          </div>
        </section>

        <!-- AMBASSADORS -->
        <section class="panel" data-panel="ambassadors">
          <div class="panel-head">
            <h2>Ambassadors</h2>
            <div class="panel-actions">
              <div class="panel-search"><svg width="12" height="12" viewBox="0 0 12 12" fill="none"><circle cx="5" cy="5" r="3.5" stroke="currentColor" stroke-width="1.2"/><path d="M11 11L8 8" stroke="currentColor" stroke-width="1.2"/></svg><input placeholder="Search ambassadors..."></div>
              <a href="#" class="btn-new">Approve queue</a>
            </div>
          </div>
          <div class="a-table amb">
            <div class="a-row head"><span>Handle</span><span>Tier</span><span>Clicks</span><span>Conversions</span><span>Revenue</span><span style="text-align:right">Payout · Status</span></div>
            ${AMBS.map(a => `
              <div class="a-row">
                <span class="nm">${a.handle}<small>30-day window</small></span>
                <span>${statPill(a.tier === 'gold' ? 'live' : a.tier === 'silver' ? 'ok' : 'low', a.tier)}</span>
                <span>${a.clicks.toLocaleString()}</span>
                <span>${a.conv}</span>
                <span>${a.revenue}</span>
                <span class="actions">${a.payout} · ${statPill(a.status === 'active' ? 'live' : 'low', a.status)}</span>
              </div>`).join('')}
          </div>
        </section>

        <!-- SETTINGS -->
        <section class="panel" data-panel="settings">
          <div class="panel-head"><h2>Settings</h2></div>
          <div class="settings-grid">
            <div class="field"><label>Brand name</label><input value=".cache"></div>
            <div class="field"><label>Member cap</label><input value="500"></div>
            <div class="field"><label>Default currency</label><input value="USD"></div>
            <div class="field"><label>Tax region</label><input value="EU + JP + US"></div>
            <div class="field"><label>Free shipping over</label><input value="$200"></div>
            <div class="field"><label>Member early window</label><input value="96 hours"></div>
            <div class="field"><label>Open registration</label><div class="toggle"><input type="checkbox" checked><span class="mono" style="font-size:11px;color:var(--fg-2)">Open</span></div></div>
            <div class="field"><label>Maintenance mode</label><div class="toggle"><input type="checkbox"><span class="mono" style="font-size:11px;color:var(--fg-2)">Live</span></div></div>
            <div class="field"><label>Discord invite</label><input value="discord.gg/BfTrruWcZ"></div>
            <div class="field"><label>Mint contract</label><input value="0xCa...c4a4"></div>
          </div>
          <div style="margin-top:60px;padding-top:32px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:18px">
            <button class="btn-new" id="save-settings">Save Settings</button>
          </div>
        </section>
      </main>
    `;

    // sign out
    document.getElementById('admin-out').addEventListener('click', (e) => {
      e.preventDefault(); adminSession.signOut(); render();
    });

    // tabs
    const nav = document.getElementById('admin-nav');
    nav.addEventListener('click', (e) => {
      const b = e.target.closest('button[data-tab]');
      if (!b) return;
      nav.querySelectorAll('button').forEach(x => x.classList.remove('is-on'));
      document.querySelectorAll('.panel').forEach(p => p.classList.remove('is-on'));
      b.classList.add('is-on');
      document.querySelector(`[data-panel="${b.dataset.tab}"]`).classList.add('is-on');
      window.scrollTo({ top: 200, behavior: 'smooth' });
    });

    const save = document.getElementById('save-settings');
    if (save) save.addEventListener('click', () => showToast('Settings saved'));
  }

  function render(){ if (adminSession.user) renderShell(); else renderGate(); }
  render();
</script>
</body>
</html>
